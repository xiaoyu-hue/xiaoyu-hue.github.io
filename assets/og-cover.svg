<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- 海洋底色：与 style.css 的 --abyss / --deep / --ocean 一致 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04111d"/>
      <stop offset="0.45" stop-color="#07273d"/>
      <stop offset="1" stop-color="#0a3a52"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.2" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#0e4a6e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e4a6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.8" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#0a6e7a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0a6e7a" stop-opacity="0"/>
    </radialGradient>

    <!-- 液态玻璃卡片 -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="1" stop-color="#0096c7"/>
    </linearGradient>

    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48cae4"/>
      <stop offset="0.55" stop-color="#0a6e7a"/>
      <stop offset="1" stop-color="#04111d"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <!-- 背景层 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <circle cx="1080" cy="70" r="230" fill="#48cae4" opacity="0.10" filter="url(#soft)"/>
  <circle cx="90" cy="580" r="200" fill="#023e8a" opacity="0.22" filter="url(#soft)"/>

  <!-- 玻璃卡片 -->
  <rect x="90" y="96" width="1020" height="438" rx="28"
        fill="url(#glass)" stroke="#96d2ff" stroke-opacity="0.22" stroke-width="1.5"/>
  <rect x="90" y="96" width="1020" height="438" rx="28"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- 站点标识 -->
  <g transform="translate(140, 150)">
    <rect width="60" height="60" rx="14" fill="url(#brand)"/>
    <path d="M9 37c5.6 0 5.6-5.6 11.2-5.6S25.8 37 31.4 37s5.6-5.6 11.2-5.6S48.2 37 53.8 37"
          fill="none" stroke="#c9f2fb" stroke-width="3.3" stroke-linecap="round" opacity="0.95"/>
    <path d="M9 48c5.6 0 5.6-4.7 11.2-4.7S25.8 48 31.4 48s5.6-4.7 11.2-4.7S48.2 48 53.8 48"
          fill="none" stroke="#c9f2fb" stroke-width="2.8" stroke-linecap="round" opacity="0.55"/>
    <circle cx="41" cy="18" r="6.5" fill="#c9f2fb" opacity="0.9"/>
  </g>

  <text x="222" y="180" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="30" font-weight="700" fill="#eaf6fb" letter-spacing="0.5">xiaoyu<tspan fill="#48cae4">-hue</tspan></text>
  <text x="222" y="208" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="17" fill="#7ba6b8" letter-spacing="1">github.io</text>

  <!-- 主标题 -->
  <text x="140" y="308" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="58" font-weight="700" fill="#eaf6fb" letter-spacing="0.5">不会写代码，</text>
  <text x="140" y="378" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="58" font-weight="700" fill="#eaf6fb" letter-spacing="0.5">能不能用 AI 做出真东西？</text>

  <!-- 强调线 -->
  <rect x="140" y="412" width="132" height="4" rx="2" fill="url(#accent)"/>

  <!-- 副标题 -->
  <text x="140" y="458" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="23" fill="#9fc0d0" letter-spacing="0.3">四个开源项目 · 全部如实标注做不到什么</text>

  <!-- 金句 -->
  <text x="140" y="500" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="21" font-weight="600" fill="#48cae4" letter-spacing="0.3">代码是 AI 写的，判断是我做的。</text>

  <!-- 底部：非程序员 × AI Agent -->
  <line x1="90" y1="556" x2="1110" y2="556" stroke="#96d2ff" stroke-opacity="0.14" stroke-width="1"/>
  <text x="140" y="592" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="19" fill="#7ba6b8" letter-spacing="3.2">非程序员 × AI AGENT</text>
  <text x="1060" y="592" text-anchor="end"
        font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="19" fill="#7ba6b8" letter-spacing="1">一半烟火以谋生，一半诗意以谋爱</text>
</svg>
