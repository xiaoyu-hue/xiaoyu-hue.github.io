name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: 契约与逻辑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 站点零依赖，用 runner 自带的 python3，不需要 setup-python
      - name: 页面契约 / 博客一致性 / 检查器自检
        run: python3 -m unittest discover -s tests -t .

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 滚动动效 / Service Worker 分流逻辑
        # 用 find 列出测试文件，兼容 Node 20（其 node --test 不支持 glob 参数）
        run: node --test $(find tests/js -name '*.test.mjs')

  e2e:
    name: 真浏览器实测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium firefox

      # 视觉回归基线在 Linux + Noto CJK 下生成；ubuntu-latest 运行器默认无中文字体，
      # 中文会渲染成豆腐块导致像素比对失败。先装同款字体再跑测试。
      - name: 安装中文字体（视觉回归比对需要）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: 性能/可访问性/SEO 红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # 不下载 puppeteer 自带 Chromium，复用运行器预装的 Chrome（与本地沙箱同款策略）
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      # ubuntu-latest 预装 Chrome，定位路径传给 lhci（跳过 sandbox 的 --no-sandbox 已在 lighthouserc.cjs 配置）
      - name: 定位系统 Chrome
        id: chrome
        run: echo "path=$(which google-chrome || which chromium || which chromium-browser)" >> "$GITHUB_OUTPUT"

      - name: 运行 Lighthouse CI（分数红线断言）
        run: npx lhci autorun
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
