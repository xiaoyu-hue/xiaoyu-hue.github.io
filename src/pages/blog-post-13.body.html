    <h1>石头跟我吵了一架</h1>
    <div class="date">2026-10-11 · 随笔</div>

    <p>今天我去吃饭的路上，被一块石头绊倒了。</p>

    <p>我爬起来一寻思，觉得不对——是这石头故意挡我路吧？结果这石头斜了我一眼，开口说：“你小子走路不看路是吧？光顾着看手机了？手机是你老婆吗？”</p>

    <p>我：？</p>

    <p>哎哟？这石头会说话。我好奇地蹲下去问它：“你怎么会说话？”</p>

    <p>石头白了我一眼：“你是傻子吗？走路为什么看手机？而且是你踢到我了！”</p>

    <p>我：？不是你绊倒我的吗。</p>

    <p>石头说：“去你的，自己走路不看路，关我什么事。”</p>

    <p>我急了：“你怎么污蔑我？”</p>

    <p>实在气不过，我一把把它扔了出去。石头在空中还在喊：“不是哥们，你不讲武德啊——”</p>
