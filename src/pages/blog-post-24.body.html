    <h1>金句收藏（一）</h1>
    <div class="date">2026-10-12 · 金句</div>

    <p>开一个小栏目，把遇见的、打动我的句子攒在这里。这一辑只有两句，都是网上看到的，记不清确切出处，如实标注为「佚名 / 网络」。</p>

    <blockquote>
      <p>人总是喜欢反季节的东西，在蝉鸣烈日的夏天，却想念冬日厚重的雪。</p>
    </blockquote>
    <p>—— 佚名 / 网络</p>

    <blockquote>
      <p>我们只是不联系了，不再分享日常，不再频繁聊天。但我们从来都不是仇人；就算以后不在同频，你我也是彼此生命中最鲜活的回忆。我们不是最熟悉的陌生人，也不是彼此讨厌的人。</p>
    </blockquote>
    <p>—— 佚名 / 网络</p>

    <p>以后攒多了，再写（二）（三）。</p>
