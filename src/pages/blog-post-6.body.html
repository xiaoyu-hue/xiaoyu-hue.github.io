    <h1>雨里的甘蔗叶</h1>
    <div class="date">2026-10-01 · 随笔</div>

    <p>今天放学，刚下公交车，天就压了下来。乌云密布，狂风乱窜，下着小雨。</p>

    <p>我走到一家店铺门口，小雨突然变成大雨，被狂风吹得倾斜。雨丝仿佛活了过来，斜斜地在空中肆意起舞。</p>

    <p>我走进店铺，隔着透明的玻璃，看到风雨里的那丛甘蔗叶。它被无情的狂风与大雨拍打着，随着风摆动，却丝毫不肯低头。它迎着风雨，像是在嘲笑风雨的无能——你没能把它击垮。</p>

    <p>我看着它，看着风雨，看着乌云。</p>

    <p>情绪不知所起，淡淡的忧伤。</p>
