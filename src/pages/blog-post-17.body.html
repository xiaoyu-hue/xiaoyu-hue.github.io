    <h1>一颗种子</h1>
    <div class="date">2026-10-11 · 随笔</div>

    <p>我刚看到一个视频，讲一位博主为留守儿童做的事：翻新他们的房子，护着他们不被别的孩子欺负。</p>

    <p>挺感动的。也在我心里埋下一颗种子——等我有钱了，我也要去帮这个社会上有困难的人。</p>

    <p>所谓立志。我的立志是：穷则独善其身，达则兼济天下。</p>
